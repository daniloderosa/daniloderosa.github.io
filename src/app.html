<!doctype html>
<html lang="%lang%" data-theme="%theme%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- SCELTA AUTOMATICA DELLA LINGUA.
         Sulle pagine inglesi, se il browser ha l'italiano come lingua
         preferita, porta alla stessa pagina in italiano. In ogni altro caso
         non fa nulla: si resta in inglese.
         - Conta solo la PRIMA lingua della lista del browser.
         - Se chi visita ha scelto una lingua a mano con il selettore (la
           scelta e salvata nel browser con la chiave "ddr-lang"), vince
           quella scelta.
         - Sulle pagine italiane non fa nulla: un link in italiano resta
           italiano per tutti.
         Sta qui, prima di tutto il resto, perche cosi il cambio avviene prima
         che la pagina si disegni e non si vede nessun lampo in inglese.
         Il valore di "twin" lo scrive src/hooks.server.js: vuoto = nessun cambio.
         (Qui sopra non va scritto il segnaposto con le percentuali: verrebbe
         sostituito lui al posto di quello dello script.) -->
    <script>
      (function () {
        var twin = '%twin%';
        // Vuoto, o non un indirizzo del sito (segnaposto non sostituito): niente.
        if (twin.charAt(0) !== '/') return;
        var saved = null;
        try {
          saved = localStorage.getItem('ddr-lang');
        } catch (e) {}
        var first = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        var wantsItalian = saved ? saved === 'it' : /^it(-|$)/i.test(first);
        if (wantsItalian) location.replace(twin + location.search + location.hash);
      })();
    </script>
    <!-- Favicon: pallina da tennis. L'SVG e per Chrome e Firefox; il PNG per
         Safari, che non sempre legge gli SVG; l'ultima e l'icona che compare
         se si aggiunge il sito alla schermata Home dell'iPhone. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />

    <!-- Caratteri del design system: Archivo (titoli), Spectral (testo),
         JetBrains Mono (numeri). Se cambi i pesi qui, aggiorna tokens.css. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Spectral:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Analytics senza cookie. Va incluso solo qui, una volta sola. -->
    <script
      data-goatcounter="https://daniloderosa.goatcounter.com/count"
      async
      src="//gc.zgo.at/count.js"
    ></script>


    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
