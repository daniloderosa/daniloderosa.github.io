<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,700&family=Barlow:wght@400;500;600;800&display=swap">
<style>
/* Layout: full-screen 3D scene; TV-style graphics anchored to the edges (score bottom left, controls top right). */
:root {
  color-scheme: dark;
  --night: #050b18;        /* arena background */
  --bar: #0d2238;          /* scoreboard bar */
  --bar-2: #3c556f;        /* points box */
  --mint: #14d8c4;         /* graphics aqua green */
  --ink: #06182a;          /* text on aqua green */
  --white: #f3f6fb;
  --dim: #9fb2c8;
  --red: #ff6b6b;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --text: "Barlow", "Helvetica Neue", Arial, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--night); color: var(--white); font-family: var(--text); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
#stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#leaders line { stroke: var(--white); stroke-width: 1.5; opacity: .75; }

.hud { position: absolute; font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; }

/* Score, bottom left */
#bug { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 2px; font-weight: 600; font-size: clamp(15px, 2.1vw, 22px); font-variant-numeric: tabular-nums; }
#bug { transform-origin: 0 100%; transition: left .6s ease, bottom .6s ease, transform .6s ease; }
#bug .row { display: flex; }
#bug .name { min-width: 7.2em; }
#bug .set { width: 1.7em; background: var(--bar); color: var(--dim); text-align: center; padding: .28em 0; }
#bug .set.won { color: var(--white); }
#bug .games { width: 1.9em; }
#bug .pts { width: 2.3em; }
#bug .name { background: var(--bar); padding: .28em .7em .28em 1.5em; position: relative; white-space: nowrap; }
#bug .row.serving .name::before { content: ""; position: absolute; left: .6em; top: 50%; width: .36em; height: .36em; margin-top: -.18em; border-radius: 50%; background: var(--mint); }
#bug .games { background: var(--mint); color: var(--ink); text-align: center; padding: .28em 0; font-weight: 700; }
#bug .pts { background: var(--bar-2); text-align: center; padding: .28em 0; }

/* Controls, top right */
#controls { z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; max-width: calc(100% - 32px); }
.seg { display: flex; background: rgba(13, 34, 56, .88); }
.seg button, #menuBtn, #simBtn, #newBtn { font: 600 14px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--white); background: transparent; border: 0; padding: 10px 12px; cursor: pointer; min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--mint); color: var(--ink); }
#menuBtn, #newBtn { background: rgba(13, 34, 56, .88); }
/* Desktop: everything on one row. Mobile: camera, mode and new match go in the menu opened by the three-line button */
#ctrlMenu { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
#menuBtn { display: none; }
#menuBtn svg { width: 20px; height: 20px; display: block; }
#menuBtn svg path { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.mlabel { display: none; }
#simBtn { background: var(--mint); color: var(--ink); }
#simBtn:disabled { opacity: .5; cursor: default; }
/* Simulating the rest of the match: court in the background, scoreboard centred and larger */
#stage { transition: filter .6s ease; }
body.sim #stage { filter: blur(7px) brightness(.4) saturate(.8); }
body.sim #bug { left: 50%; bottom: 50%; transform: translate(-50%, 50%) scale(1.7); transform-origin: 50% 50%; }
body.sim #prompt, body.sim #choices, body.sim #leaders, body.sim #feed, body.sim #controls .seg { display: none; }
#simTitle { left: 50%; transform: translateX(-50%); top: calc(50% - 150px); font-weight: 600; font-size: clamp(15px, 2.2vw, 21px); letter-spacing: .12em; color: var(--mint); white-space: nowrap; }
/* End-of-match statistics */
#stats { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(5, 11, 24, .55); overflow-y: auto; }
#stats .sp { flex-shrink: 0; margin-block: auto; width: min(100%, 780px); background: rgba(9, 24, 42, .97); border-top: 4px solid var(--mint); padding: 18px clamp(14px, 3vw, 26px) 20px; display: grid; gap: 16px; font-family: var(--display); text-transform: uppercase; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
#stats h2 { margin: 0; font: italic 700 clamp(24px, 5vw, 32px)/1 var(--display); color: var(--white); text-align: center; }
#stats .sc { display: grid; gap: 2px; }
#stats .sc .r { display: flex; align-items: stretch; gap: 2px; font-weight: 600; font-size: clamp(17px, 3.2vw, 24px); }
#stats .sc .n { flex: 1; background: var(--bar); padding: .25em .6em; color: var(--dim); }
#stats .sc .r.win .n { color: var(--mint); }
#stats .sc .s { width: 1.8em; background: var(--bar); text-align: center; padding: .25em 0; color: var(--dim); }
#stats .sc .s.w { color: var(--white); }
#stats .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
#stats .blk h3 { margin: 0 0 6px; font: 600 15px var(--display); letter-spacing: .12em; color: var(--white); background: var(--bar-2); padding: .4em .6em; text-align: center; }
#stats table { width: 100%; border-collapse: collapse; font-size: 15px; }
#stats td { padding: .32em .4em; border-bottom: 1px solid rgba(159, 178, 200, .15); }
#stats td.l { color: var(--dim); font-size: 13px; letter-spacing: .08em; }
#stats td.v { text-align: right; font-weight: 600; color: var(--white); width: 30%; }
#stats td.v.hi { color: var(--mint); }
#stats tr.tot td { font-size: 18px; border-bottom: 0; }
#stats .bar { display: block; height: 3px; background: rgba(159, 178, 200, .2); margin-top: 3px; }
#stats .bar i { display: block; height: 100%; background: var(--mint); }
#stats .note { margin: 0; font: 400 12px/1.4 var(--text); text-transform: none; letter-spacing: 0; color: var(--dim); text-align: center; }
#stats .cta { min-width: 220px; }
#stats .endrow { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; justify-content: center; }
#stats .endrow a { font: 600 15px var(--display); letter-spacing: .08em; color: var(--mint); text-decoration: underline; text-underline-offset: 4px; }
#howBody { display: grid; gap: 14px; text-transform: none; letter-spacing: 0; }
#howBody h3 { margin: 0; font: 600 15px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--white); background: var(--bar-2); padding: .4em .6em; }
#howBody p, #howBody li { margin: 0; font: 400 14px/1.5 var(--text); color: var(--white); }
#howBody ol { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
#howBody b { color: var(--mint); font-weight: 600; }
#howBody .src { font-size: 12px; color: var(--dim); }
@media (max-width: 560px) { #stats .two { grid-template-columns: 1fr; } }
/* Invitation to simulate: dark veil, highlighted button, arrow and text */
#hint { position: absolute; inset: 0; z-index: 8; background: rgba(3, 8, 18, .55); cursor: pointer; }
#hint svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
#hint svg path { fill: none; stroke: var(--white); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
#hintText { position: absolute; margin: 0; max-width: 230px; font: italic 700 clamp(20px, 3vw, 26px)/1.05 var(--display); text-transform: uppercase; color: var(--white); text-align: right; }
#hintText small { display: block; margin-top: 8px; font: 500 13px var(--text); font-style: normal; text-transform: none; color: var(--dim); }
body.hint #controls { z-index: 9; }
body.hint #controls .seg, body.hint #menuBtn, body.hint #newBtn { opacity: .2; }
body.hint #simBtn { box-shadow: 0 0 0 3px var(--white), 0 0 24px rgba(20, 216, 196, .8); }
/* Tutorial */
#tut { position: absolute; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(5, 11, 24, .72); }
#tut .panel { width: min(100%, 440px); }
#tut .step { font: 600 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 0; }
#tut h2.t { font: italic 700 clamp(26px, 6vw, 34px)/1 var(--display); text-transform: uppercase; color: var(--white); letter-spacing: 0; margin: 0; }
#tut p.b { margin: 0; font-size: 15px; line-height: 1.5; color: var(--white); }
#tut .row2 { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
#tut .row2 button { font: 600 15px var(--display); letter-spacing: .06em; text-transform: uppercase; border: 0; padding: 10px 14px; cursor: pointer; }
#tutSkip { background: transparent; color: var(--dim); }
#tutPrev { background: var(--bar-2); color: var(--white); }
#tutNext { background: var(--mint); color: var(--ink); }
.linkbtn { font: 600 14px var(--display); letter-spacing: .06em; text-transform: uppercase; background: transparent; border: 0; color: var(--mint); cursor: pointer; padding: 4px 0; justify-self: start; }
button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }

/* What to do and rally phase */
#prompt { left: 50%; transform: translateX(-50%); top: calc(60px + env(safe-area-inset-top, 0px)); display: flex; gap: 2px; align-items: stretch; font-weight: 600; font-size: clamp(14px, 1.9vw, 19px); white-space: nowrap; }
#prompt span { background: var(--white); color: var(--ink); padding: .35em .8em; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
#prompt #phase { background: var(--bar-2); color: var(--white); }
#prompt #phase.attack, #prompt #phase.xattack { background: var(--mint); color: var(--ink); }
#prompt #phase.defence, #prompt #phase.xdefence { background: var(--red); color: #2a0808; }

/* Point outcome, bottom centre */
#caption { left: 50%; transform: translateX(-50%); bottom: calc(18% + env(safe-area-inset-bottom, 0px)); text-align: center; display: grid; gap: 2px; justify-items: center; pointer-events: none; }
#caption .big { background: var(--mint); color: var(--ink); font-weight: 700; font-style: italic; font-size: clamp(22px, 4vw, 40px); padding: .1em .6em; }
#caption .small { background: var(--bar); font-weight: 600; font-size: clamp(13px, 1.8vw, 18px); padding: .3em .8em; }

/* Shot commentary (detailed mode only) */
#feed { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 2px; justify-items: end; font-weight: 500; font-size: 13px; max-width: 46%; pointer-events: none; }
#feed div { background: rgba(13, 34, 56, .85); padding: .3em .7em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
#feed div:not(:last-child) { opacity: .6; }
body.tv #feed { right: auto; left: var(--feed-left, 280px); justify-items: start; max-width: 40%; }
body:not(.detail) #feed, body:not(.detail) #phase, body:not(.detail) .opt small { display: none; }

/* Targets: clickable labels anchored to the court */
#choices { position: absolute; inset: 0; pointer-events: none; }
.stack { position: absolute; display: grid; gap: 3px; transform: translate(-50%, -100%); pointer-events: auto; }
.opt { font: 600 13px/1.15 var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--white); background: var(--bar); border: 0; border-left: 4px solid var(--mint); padding: 7px 9px; text-align: left; cursor: pointer; min-height: 34px; }
.opt:hover, .opt:focus-visible { background: var(--mint); color: var(--ink); }
.opt small { display: block; font: 500 11px/1.2 var(--text); letter-spacing: 0; text-transform: none; opacity: .85; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* Start and end menu */
#noGl { position: absolute; inset: 0; z-index: 20; display: grid; align-content: center; justify-items: center; gap: 14px; padding: 24px; background: var(--night); color: var(--white); text-align: center; font: 400 16px/1.5 var(--text); }
#noGl h1 { margin: 0; font: italic 700 clamp(28px, 6vw, 44px)/1 var(--display); text-transform: uppercase; }
#noGl p { margin: 0; max-width: 560px; }
#menu { z-index: 5; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: linear-gradient(rgba(5, 11, 24, .35), rgba(5, 11, 24, .8)); overflow-y: auto; }
.panel { flex-shrink: 0; margin-block: auto; width: min(100%, 460px); background: rgba(9, 24, 42, .94); border-top: 4px solid var(--mint); padding: 22px 22px 18px; display: grid; gap: 16px; }
.panel .eyebrow { font: 600 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin: 0; }
.panel h1 { font: italic 700 clamp(34px, 9vw, 46px)/.95 var(--display); text-transform: uppercase; margin: 0; text-wrap: balance; }
.panel h2 { font: 600 13px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin: 0 0 6px; }
.chips { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.chips button { font: 600 16px var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--white); background: var(--bar-2); border: 0; padding: 10px 8px; cursor: pointer; min-width: 0; }
.chips button[aria-pressed="true"] { background: var(--mint); color: var(--ink); }
.chips button:disabled { opacity: .3; cursor: default; }
.cta:disabled { opacity: .5; cursor: default; }
.cta { font: italic 700 22px var(--display); letter-spacing: .06em; text-transform: uppercase; background: var(--mint); color: var(--ink); border: 0; padding: 12px; cursor: pointer; }
.panel p { margin: 0; font-size: 13px; line-height: 1.45; color: var(--dim); }
.langsel { display: flex; gap: 6px; justify-self: start; }
.langsel button { display: inline-flex; align-items: center; gap: 7px; font: 600 14px var(--display); letter-spacing: .08em; color: var(--white); background: var(--bar-2); border: 0; padding: 8px 12px; cursor: pointer; min-height: 36px; }
.langsel button[aria-pressed="true"] { background: var(--mint); color: var(--ink); }
.langsel svg { width: 20px; height: 10px; display: block; }
.panel p.credit { font-size: 12px; opacity: .85; }
.panel .result { font: 600 18px var(--display); letter-spacing: .04em; text-transform: uppercase; color: var(--white); }

@media (max-width: 560px) {
  #prompt { top: calc(64px + env(safe-area-inset-top, 0px)); } /* controls fit on one row: the menu holds the rest */
  #feed, body.tv #feed { left: auto; right: max(16px, env(safe-area-inset-right, 0px)); justify-items: end; bottom: calc(88px + env(safe-area-inset-bottom, 0px)); max-width: 70%; }
  .opt { font-size: 12px; padding: 6px 7px; }
  #controls { flex-wrap: nowrap; align-items: flex-start; }
  #menuBtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; min-height: 36px; padding: 0; }
  #menuBtn[aria-expanded="true"] { background: var(--mint); color: var(--ink); }
  #ctrlMenu { display: none; position: absolute; right: 0; top: calc(100% + 6px); flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 6px; min-width: 210px; padding: 12px; background: rgba(9, 24, 42, .97); border-top: 3px solid var(--mint); box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
  #controls.open #ctrlMenu { display: flex; }
  #ctrlMenu .seg button { flex: 1; }
  #ctrlMenu #newBtn { margin-top: 6px; background: var(--bar-2); }
  .mlabel { display: block; font: 600 12px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
}
</style>

<div id="app">
  <canvas id="stage" data-ta="court3d"></canvas>
  <svg id="leaders" aria-hidden="true"></svg>
  <div id="choices"></div>

  <div id="prompt" class="hud" hidden><span id="promptText"></span><span id="phase"></span></div>
  <div id="caption" class="hud" hidden><div class="big" id="capBig"></div><div class="small" id="capSmall"></div></div>
  <div id="feed" class="hud" aria-live="polite"></div>

  <div id="simTitle" class="hud" data-t="simTitle" hidden></div>
  <div id="bug" class="hud" hidden>
    <div class="row" id="rowA"></div>
    <div class="row" id="rowB"></div>
  </div>

  <div id="controls" class="hud">
    <!-- on mobile this group becomes the menu opened by #menuBtn -->
    <div id="ctrlMenu">
      <span class="mlabel" data-t="camera"></span>
      <div class="seg" role="group" data-ta="camera">
        <button id="camPov" aria-pressed="false">POV</button><button id="camTv" aria-pressed="true">TV</button>
      </div>
      <span class="mlabel" data-t="mode"></span>
      <div class="seg" role="group" data-ta="mode">
        <button id="modeNormal" aria-pressed="true" data-t="normal"></button><button id="modeDetail" aria-pressed="false" data-t="detailed"></button>
      </div>
      <button id="newBtn" type="button" data-t="newMatch" hidden></button>
    </div>
    <button id="simBtn" data-t="simBtn" hidden></button>
    <button id="menuBtn" type="button" aria-expanded="false" aria-controls="ctrlMenu" data-ta="menu"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  </div>

  <div id="menu">
    <div class="panel">
      <h1>ATP Finals Simulator</h1>
      <!-- language: chosen only here, before the first match (same order as the website: EN first, then IT) -->
      <div class="langsel" id="langSel" role="group" data-ta="language">
        <button type="button" data-lang="en"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="60" height="30" fill="#B22234"/><g fill="#FFFFFF"><rect y="2.31" width="60" height="2.31"/><rect y="6.92" width="60" height="2.31"/><rect y="11.54" width="60" height="2.31"/><rect y="16.15" width="60" height="2.31"/><rect y="20.77" width="60" height="2.31"/><rect y="25.38" width="60" height="2.31"/></g><rect width="24" height="16.15" fill="#3C3B6E"/></svg>EN</button>
        <button type="button" data-lang="it"><svg viewBox="0 0 60 30" aria-hidden="true"><rect width="20" height="30" fill="#008C45"/><rect x="20" width="20" height="30" fill="#F4F5F0"/><rect x="40" width="20" height="30" fill="#CD212A"/></svg>IT</button>
      </div>
      <p class="result" id="result" hidden></p>
      <div><h2 data-t="yourPlayer"></h2><div class="chips" id="pickMe"></div></div>
      <div><h2 data-t="opponent"></h2><div class="chips" id="pickOp"></div></div>
      <button class="cta" id="startBtn"></button>
      <button class="linkbtn" id="tutBtn" type="button" data-t="howToPlay"></button>
      <p data-t="intro"></p>
      <p class="credit" data-t="credit"></p>
    </div>
  </div>

  <div id="stats" hidden><div class="sp" role="dialog" aria-labelledby="statsTitle">
    <h2 id="statsTitle" data-t="statsTitle"></h2>
    <div id="statsBody"></div>
    <p class="note" data-t="statsNote"></p>
    <div class="endrow"><button class="cta" id="replayBtn" type="button" data-t="replay"></button><a href="#" id="howLink" data-t="howLink"></a></div>
  </div>
  <div class="sp" id="howPanel" role="dialog" aria-labelledby="howTitle" hidden>
    <h2 id="howTitle" data-t="howTitle"></h2>
    <div id="howBody"></div>
    <div class="endrow"><a href="#" id="howBack" data-t="howBack"></a><button class="cta" id="replayBtn2" type="button" data-t="replay"></button></div>
  </div></div>

// Simulation engine: pure logic, no UI dependencies (labels and texts live in the game).
// Zones: L/M/R always in the frame of the player who hits (their left / middle / their right).

// The 9 rally play types tracked by TennisViz
const PLAYS = ['forehand_crosscourt', 'forehand_line', 'forehand_from_the_middle', 'forehand_inside_in_out',
  'backhand_crosscourt', 'backhand_line', 'backhand_from_the_middle', 'volleys', 'drop_shots'];
const GROUND_PLAYS = ['forehand_crosscourt', 'forehand_line', 'forehand_from_the_middle', 'forehand_inside_in_out',
  'backhand_crosscourt', 'backhand_line', 'backhand_from_the_middle'];
const MIN_SHARE = 0.05; // a play is possible from a zone if at least 5% of the player's shots from there are of that type

function pick(dist, rng = Math.random) {
  const tot = Object.values(dist).reduce((a, b) => a + b, 0);
  let r = rng() * tot;
  for (const [k, w] of Object.entries(dist)) if ((r -= w) <= 0) return k;
  return Object.keys(dist).at(-1);
}

// --- When a volley can be played ---
// prevOwn / prevOpp: last shot of the hitter and of the opponent, { kind: 'serve'|'return'|'shot', play, attack }

// after one's own shot that led to attack. Never when hitting in defence.
function volleyAllowed(phase, prevOwn, prevOpp) {
  if (isDef(phase) || !prevOwn) return false;

async function endPoint(w, big, small, info) {

// Simulates the remaining points with the engine: the scoreboard moves to the centre, the pace speeds up
async function simulateRest() {
  G.simulating = true; updateSimBtn(); setPrompt(''); endChoice();
  document.body.classList.add('sim'); $('simTitle').hidden = false;
  const tmp = JSON.parse(JSON.stringify(G.sc)), winners = [], infos = [];
  while (!tmp.over && winners.length < 2000) {
    const S = tmp.server, R = other(S), r = simPoint(P(S), P(R), sideFor(tmp.pts.A, tmp.pts.B), G.k, Math.random, MODEL.persist ?? 1), map = x => (x === 'A' ? S : R), i = r.info;
    const w = map(r.winner); winners.push(w); addPoint(tmp, w);
    infos.push({ S, df: i.df, ace: i.ace, unret: i.unret, rally: i.rally, net: { [S]: i.net.A, [R]: i.net.B }, end: i.end && { ...i.end, by: map(i.end.by) } });
  }
  // constant pace: 0.45 s per point, or less if there are many points (8 seconds at most overall).
  // Wall clock, not game time: so the limit holds on a slow device too
  const step = Math.min(.45, 8 / Math.max(1, winners.length)), cum = winners.map((w, i) => (i + 1) * step);
  const my = runId, sleep = ms => new Promise(r => setTimeout(r, ms));
  await sleep(300); if (my !== runId) throw ABORT;
  let idx = 0; const t0 = performance.now();
  await new Promise((res, rej) => {
    const step = () => {
      if (my !== runId) return rej(ABORT);
      const el = (performance.now() - t0) / 1000; let ch = false;
      while (idx < winners.length && cum[idx] <= el) { tally(G.st, infos[idx], winners[idx]); addPoint(G.sc, winners[idx++]); ch = true; }
      if (ch) updateBug();
      if (idx >= winners.length) return res();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
  updateBug(); $('simTitle').textContent = `${lastName(P(G.sc.winner))} vince ${setsLine(G.sc, G.sc.winner)}`;
  await sleep(1400); if (my !== runId) throw ABORT;
}

async function runMatch(me, op) {
  const my = ++runId;
  document.body.classList.remove('sim'); $('simTitle').hidden = true; $('simTitle').textContent = tr('simTitle');
  G = { me: MODEL.players[me], op: MODEL.players[op], sc: newScore(), st: newStats(), k: MODEL.phaseK, simulating: false, simReq: false };
  $('stats').hidden = true;
  setupPlayers(); $('feed').innerHTML = ''; $('bug').hidden = false; $('menu').hidden = true; $('newBtn').hidden = false; updateBug(); updateSimBtn();
  try {
    if (!tutDone()) await showTutorial();
    while (!G.sc.over) { await playPoint(); if (G.sc.played === 2 && !G.sc.over && !G.simReq) await showSimHint(); if (G.simReq) throw ABORT; await wait(.6); }
  } catch (e) {
    if (e !== ABORT) { console.error('Error in point:', e && e.stack || e); throw e; }

  }
  if (my !== runId) return;

  $('result').textContent = `${lastName(P(w))} ${tr('beats')} ${lastName(P(other(w)))} ${setsLine(G.sc, w)}`; $('result').hidden = false;
  $('simTitle').hidden = true; updateSimBtn(); setPrompt('');

}

  const c3 = { n: 3, sn: '1' }, d = outcomeDist(me, op, 'forehand_crosscourt', 'neutral', G.k, null, c3), da = outcomeDist(me, op, 'forehand_crosscourt', 'attack', G.k, null, c3), ret = op.ret.deuce.dirs;

    <h3>Da dove arrivano i dati</h3>
    <p>I numeri vengono dal tracciamento delle partite fornito da TennisViz (portale Courtside Advantage): per ogni colpo ci sono il punto d'impatto, il punto di rimbalzo, la velocità e l'esito. Il gioco usa tutte le partite degli 8 giocatori nei tornei sul cemento tra settembre e novembre 2026 (Tokyo, Pechino, Shanghai, Almaty, Lione, Bruxelles, Vienna, Basilea, Parigi): <b>88 partite</b>. Quando un dato è raro, viene mescolato con la media del giocatore nelle ultime 52 settimane, per non fidarsi di pochi casi.</p>
    <h3>Come funziona il motore</h3>
    <p>Ogni momento del punto è un dado truccato: le facce pesano quanto dicono i dati del giocatore. C'è un dado per il servizio (entra? è vincente o la risposta rimane in campo?), uno per la risposta e uno per ciascun colpo di scambio, diverso a seconda della direzione. Ogni colpo può essere <b>positivo</b> (vincente, oppure mette l'avversario in difficoltà), <b>neutro</b> o <b>negativo</b> (errore, oppure dà all'avversario il vantaggio).</p>
    <p>Un semaforo segue chi comanda lo scambio: se un giocatore è in attacco, l'altro è in difesa; in attacco i colpi positivi diventano più probabili, in difesa i negativi. Anche l'avversario conta: contro un grande difensore o un grande ribattitore i dadi si restringono. La forza del semaforo è tarata finché le partite simulate somigliano a quelle vere (punti vinti al servizio, punti vinti partendo in attacco o in difesa).</p>

    <h3>Where the data come from</h3>
    <p>The numbers come from the match tracking provided by TennisViz (Courtside Advantage portal): for every shot there are the contact point, the bounce point, the speed and the outcome. The game uses all the matches of the 8 players in the hard-court events between September and November 2026 (Tokyo, Beijing, Shanghai, Almaty, Lyon, Brussels, Vienna, Basel, Paris): <b>88 matches</b>. When a figure is rare, it is blended with the player's average over the last 52 weeks, so as not to trust a handful of cases.</p>
    <h3>How the engine works</h3>
    <p>Every moment of the point is a loaded die: the faces weigh as much as the player's data say. There is a die for the serve (is it in? is it an ace, or does the return stay in play?), one for the return and one for each rally shot, different for each direction. Every shot can be <b>positive</b> (a winner, or it puts the opponent in trouble), <b>neutral</b> or <b>negative</b> (an error, or it hands the opponent the advantage).</p>

$('howBack').onclick = e => { e.preventDefault(); $('howPanel').hidden = true; $('statsTitle').parentElement.hidden = false; $('howLink').focus(); };

$('replayBtn').onclick = () => { $('stats').hidden = true; document.body.classList.remove('sim'); $('bug').hidden = true; $('startBtn').textContent = tr('play'); $('menu').hidden = false; $('newBtn').hidden = true; };
// New match: stops the current one and goes back to the choice of players
$('newBtn').onclick = () => { abortRun(); setPrompt(''); $('feed').innerHTML = ''; $('caption').hidden = true; $('replayBtn').onclick(); };
// Mobile menu: opens and closes with the three-line button, closes after a choice or a tap elsewhere
function setCtrlMenu(open) { $('controls').classList.toggle('open', open); $('menuBtn').setAttribute('aria-expanded', open); }
$('menuBtn').onclick = () => setCtrlMenu(!$('controls').classList.contains('open'));
$('ctrlMenu').addEventListener('click', e => { if (e.target.closest('button')) setCtrlMenu(false); });
document.addEventListener('pointerdown', e => { if (!$('controls').contains(e.target)) setCtrlMenu(false); });
$('simBtn').onclick = () => { if (!G || G.simulating || G.sc.over) return; G.simReq = true; hideSimHint(); stopPoint(); };

// ---------- Menu and controls ----------
let sel = { me: null, op: null }; // player selection in the menu (do not call it pick: that is the engine function)
function buildMenu() {
  const ids = Object.keys(MODEL.players);
  sel.me = ids.find(i => /Alcaraz/.test(MODEL.players[i].name)) || ids[0];
  sel.op = ids.find(i => /Shelton/.test(MODEL.players[i].name)) || ids[1];
  const render = () => {
    for (const [box, key] of [[$('pickMe'), 'me'], [$('pickOp'), 'op']]) {
      box.innerHTML = '';
      for (const id of ids) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = lastName(MODEL.players[id]);
        b.setAttribute('aria-pressed', sel[key] === id); b.disabled = key === 'op' && id === sel.me;
        b.onclick = () => { sel[key] = id; if (sel.op === sel.me) sel.op = ids.find(i => i !== sel.me); render(); };
        box.appendChild(b);
      }
    }
  };
  render();
  $('startBtn').onclick = () => { langLocked = true; $('langSel').hidden = true; abortRun(); runMatch(sel.me, sel.op); }; // from now on the language is fixed
  for (const b of document.querySelectorAll('#langSel button')) b.onclick = () => {
    if (langLocked) return;
    lang = b.dataset.lang; try { localStorage.setItem('ddr-lang', lang); } catch (e) { /* storage blocked: the choice lasts for this visit */ }
    applyLang();
  };
}
function setView(v) { view = v; document.body.classList.toggle('tv', v === 'tv'); placeFeed(); $('camPov').setAttribute('aria-pressed', v === 'pov'); $('camTv').setAttribute('aria-pressed', v === 'tv'); }
function setDetail(on) { document.body.classList.toggle('detail', on); $('modeNormal').setAttribute('aria-pressed', !on); $('modeDetail').setAttribute('aria-pressed', on); }
$('camPov').onclick = () => setView('pov'); $('camTv').onclick = () => setView('tv');
setView('tv'); // starting view: TV
$('modeNormal').onclick = () => setDetail(false); $('modeDetail').onclick = () => setDetail(true);

// ---------- Cameras ----------
const camPos = new V3(0, 10.5, 43.4), camLook = new V3(0, 0, 1.9), tmpA = new V3(), tmpB = new V3();
let camFov = 16, firstFrame = true, povHold = null;
const phoneUI = matchMedia('(max-width: 560px)'); // same breakpoint as the mobile layout
const ZOOM = { y: 22, z: 14, l: -6, f: 40 };
function updateCamera(dt, time) {
  const aspect = camera.aspect, inMenu = !$('menu').hidden;
  let tp = tmpA, tl = tmpB, fov, near = .05;
  if (view === 'tv' || inMenu || !G) {
    // TV view: behind and above the court; higher on portrait screens, to fit the whole court
    const u = clamp((1.45 - aspect) / .95, 0, 1), y = lerp(10.5, 30, u), z = lerp(43.4, 31.5, u);
    tp.set(inMenu ? Math.sin(time * .12) * 2.5 : 0, y, z); tl.set(0, 0, lerp(1.9, .5, u));
    const dist = Math.hypot(y, z - C.halfL), hf = 2 * Math.atan(7.4 / dist);
    fov = Math.max(lerp(16, 40, u), T3.MathUtils.radToDeg(2 * Math.atan(Math.tan(hf / 2) / aspect)));
    near = lerp(24, 1, u);
    if (G && !inMenu && choosing && phoneUI.matches) {
      // phones, your turn: closer on the opponent's half, so the options sit lower and clear of the prompt
      // (your player may leave the frame)
      const Z = window.__zoom || ZOOM; tp.set(0, Z.y, Z.z); tl.set(0, 0, Z.l); fov = Z.f; near = 1;
    }
  } else {
    // POV: from your player's eyes
    const m = men.A; if (!choosing || !povHold) povHold = m.head.clone(); tp.copy(choosing ? povHold : m.head);
    const focus = tl.set(m.x * .25, 1.0, -5.5);
    if (!choosing) { const d = Math.hypot(ball.pos.x - m.x, ball.pos.z - m.z), w = clamp((d - 2.5) / 9, 0, .6); focus.lerp(ball.pos, w); }
    fov = aspect < 1 ? 80 : 62;
  }
  const a = firstFrame ? 1 : 1 - Math.exp(-dt * 7);
  camPos.lerp(tp, a); camLook.lerp(tl, firstFrame ? 1 : 1 - Math.exp(-dt * 5)); camFov = lerp(camFov, fov, a);
  camera.position.copy(camPos); camera.lookAt(camLook); camera.fov = camFov; camera.near = near; camera.updateProjectionMatrix();
  firstFrame = false;
  // in POV your mannequin disappears and the racket stays in the foreground
  const pov = view === 'pov' && !inMenu && !!G;
  if (men.A) men.A.setVisible(!pov);
  const D = window.__dbgCam; if (D && D.follow && men[D.follow]) { const r = men[D.follow].root.position; D.p = [r.x + D.o[0], D.o[1], r.z + D.o[2]]; D.l = [r.x, 1.15, r.z]; }
  if (D) { camera.position.set(...D.p); camera.lookAt(...D.l); camera.fov = D.f || 40; camera.near = .05; camera.updateProjectionMatrix(); if (men.A) men.A.setVisible(true); }
  if (povRacket) {
    povRacket.visible = pov;
    const hs = G && G.me.hand === 'right' ? 1 : -1;
    let px = hs * .62, py = -.6, pz = -.9, rx = -.5, ry = 0, rz = Math.PI + hs * .6;
    let swKind = null, swK = 0; // for the arms below
    if (povSwing) {
      povSwing.t += dt; const k = Math.min(1, povSwing.t / povSwing.dur), e = ease(k), bump = Math.sin(k * Math.PI);
      swKind = povSwing.kind; swK = k;
      if (povSwing.kind === 'fh') { px = hs * lerp(.75, -.25, e); ry = hs * lerp(-1.1, 1.0, e); py += bump * .12; }
      else if (povSwing.kind === 'bh') { px = hs * lerp(-.45, .65, e); ry = hs * lerp(1.2, -.9, e); py += bump * .12; }
      else { px = hs * .3; py = lerp(-.6, .25, Math.sin(Math.min(1, k / .68) * Math.PI / 2)) - (k > .68 ? (k - .68) * 2.2 : 0); rx = lerp(-.45, -1.6, e); }
      if (k >= 1) povSwing = null;
    }
    povRacket.position.set(px, py, pz); povRacket.rotation.set(rx, ry, rz);
    if (povArms) {
      povArms.g.visible = pov;
      if (pov) {
        // hands: the dominant one on the grip; the other on the throat at rest, on the grip above it in the
        // two-handed backhand, out in front for balance in the forehand, tossing the ball in the serve
        povRacket.updateMatrix();
        const onRacket = y => new V3(0, y, 0).applyMatrix4(povRacket.matrix);
        let off;
        if (swKind === 'bh') off = onRacket(-.165);
        else if (swKind === 'fh') { const e = ease(swK); off = new V3(-hs * lerp(.3, -.05, e), lerp(-.38, -.78, e), lerp(-1.0, -.55, e)); }
        else if (swKind === 'serve') { const up = Math.sin(Math.min(1, swK / .4) * Math.PI / 2), down = clamp((swK - .4) / .6, 0, 1); off = new V3(-hs * lerp(.2, .12, up), lerp(-.62, .12, up) - down * .9, lerp(-.8, -.95, up) + down * .3); }
        else off = onRacket(-.225);
        const A = povArms;
        // the free hand moves smoothly between poses; on the racket it follows the grip exactly
        const onGrip = swKind === 'bh' || !swKind;
        if (!A.off.cur || onGrip) A.off.cur = (A.off.cur || new V3()).copy(off); else A.off.cur.lerp(off, 1 - Math.exp(-dt * 16));
        placeArm(A.dom, new V3(hs * .4, -.66, -.12), onRacket(-.07), new V3(hs * .8, -1, .25));
        placeArm(A.off, new V3(-hs * .4, -.66, -.12), A.off.cur, new V3(-hs * .8, -1, .25));
      }
    }
  }
}

// ---------- Render loop ----------
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio()) || canvas.height !== Math.round(h * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), time = now / 1000; last = now;
  resize();
  for (const tw of [...tweens]) {
    tw.t += dt; const k = Math.min(1, tw.t / tw.dur);
    try { tw.fn(k, tw.t); } catch (e) { tweens.delete(tw); tw.rej(e); continue; }
    if (k >= 1) { tweens.delete(tw); tw.res(); }
  }
  if (activeHold) activeHold();
  for (const k of ['A', 'B']) if (men[k]) men[k].update(dt, time, ball.pos);
  // ball, shadow and trail
  ball.mesh.position.copy(ball.pos); ball.mesh.scale.setScalar(view === 'tv' ? 1.5 : 1);
  ball.mesh.visible = ball.shadow.visible = ball.trailLine.visible = !(view === 'pov' && activeHold && $('menu').hidden);
  ball.shadow.position.set(ball.pos.x, .006, ball.pos.z); ball.shadow.scale.setScalar(clamp(1.6 - ball.pos.y * .25, .6, 1.6)); ball.shadow.material.opacity = clamp(.5 - ball.pos.y * .08, .12, .5);
  ball.trail.push(ball.pos.clone()); if (ball.trail.length > 12) ball.trail.shift();
  const arr = ball.trailLine.geometry.attributes.position.array;
  for (let i = 0; i < 12; i++) { const p = ball.trail[Math.min(i, ball.trail.length - 1)]; arr[i * 3] = p.x; arr[i * 3 + 1] = p.y; arr[i * 3 + 2] = p.z; }
  ball.trailLine.geometry.attributes.position.needsUpdate = true;
  for (let i = marks.length - 1; i >= 0; i--) {
    const mk = marks[i]; mk.t += dt; mk.m.scale.setScalar(1 + mk.t * 1.6); mk.m.material.opacity = Math.max(0, .95 - mk.t * 1.1);
    if (mk.t > .9) { scene.remove(mk.m); mk.m.geometry.dispose(); mk.m.material.dispose(); marks.splice(i, 1); }
  }
  updateCamera(dt, time);
  layoutChoices();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- Start: wait for the fonts for the lettering, then build the arena ----------
async function boot() {
  try { await Promise.race([Promise.all([document.fonts.load('700 40px "Barlow Condensed"'), document.fonts.load('800 40px Barlow')]), new Promise(r => setTimeout(r, 1500))]); } catch (e) { /* fallback font */ }
  applyLang(); buildArena(); buildBall(); buildMenu();
  // two mannequins on court behind the menu as well
  const ids = Object.keys(MODEL.players);
  G = { me: MODEL.players[sel.me], op: MODEL.players[sel.op], sc: newScore() };
  const idle = () => { setupPlayers(); men.A.place(1.1, 12.3); men.B.place(-3.2, -12.8); ball.pos.set(1.1, 1.2, 12.1); };
  idle(); requestAnimationFrame(frame);
  const sb = $('startBtn'); sb.disabled = true; sb.textContent = tr('loading');
  // the Italian website page shares the English page's rig file, named by data-rig-path
  humanSrc = await loadRig(document.documentElement.getAttribute('data-rig-path') || 'rig', { proc: true });
  if (humanSrc && !$('menu').hidden) idle();
  sb.disabled = false; sb.textContent = tr('play');
}
setExtreme(MODEL.xErr ?? .92, MODEL.xWin ?? .92); setShotMod(MODEL.shotMod || {}); setKfe(MODEL.kfe || 0);
window.__sim = { solveShot, bounce, V3, pov: () => povSwing && { kind: povSwing.kind, k: povSwing.t / povSwing.dur }, human: () => !!humanSrc, ball: () => ball.pos.toArray().map(v => +v.toFixed(2)), men: () => ['A', 'B'].map(k => men[k] && [+men[k].x.toFixed(2), +men[k].z.toFixed(2)]), state: () => G && { sc: G.sc, tweens: tweens.size, choosing, sim: G.simulating, feed: [...document.querySelectorAll('#feed div')].map(d => d.textContent), cap: !document.getElementById('caption').hidden && document.getElementById('capBig').textContent } }; // hook for tests
boot();
})();
</script>
